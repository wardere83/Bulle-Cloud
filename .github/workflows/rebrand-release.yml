name: BulleBrowser - Download, Rebrand & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.40.1)'
        required: true
        default: 'v0.40.1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebrand-release.yml'

jobs:
  rebrand-and-upload:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version }}
      REPO: wardere83/Bulle-Cloud
    steps:
      - name: Download BrowserOS assets and rename to BulleBrowser
        run: |
          set -e
          VER="${VERSION}"
          mkdir -p assets
          echo "Downloading BrowserOS ${VER} assets..."
          FILES=(
            "BrowserOS_${VER}_amd64.deb"
            "BrowserOS_${VER}_arm64.dmg"
            "BrowserOS_${VER}_universal.dmg"
            "BrowserOS_${VER}_x64.AppImage"
            "BrowserOS_${VER}_x64.dmg"
            "BrowserOS_${VER}_x64_installer.exe"
            "BrowserOS_${VER}_x64_installer.zip"
          )
          for SRC in "${FILES[@]}"; do
            DEST=$(echo "${SRC}" | sed 's/BrowserOS/BulleBrowser/')
            URL="https://github.com/browseros-ai/BrowserOS/releases/download/${VER}/${SRC}"
            echo "  Downloading ${SRC} -> ${DEST}"
            if wget -q --show-progress -O "assets/${DEST}" "${URL}"; then
              echo "  SUCCESS: ${DEST}"
            else
              echo "  WARNING: Failed to download ${SRC}, skipping"
              rm -f "assets/${DEST}"
            fi
          done
          ls -lh assets/ || echo "No assets downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        run: |
          cat > /tmp/release_notes.md << 'NOTES'
          ## BulleBrowser ${{ github.event.inputs.version }}

          The AI-Powered Agentic Browser by Bulle Consulting.

          ### Downloads
          | Platform | Download |
          |----------|----------|
          | Windows (x64 Installer) | BulleBrowser_${{ github.event.inputs.version }}_x64_installer.exe |
          | Windows (x64 ZIP) | BulleBrowser_${{ github.event.inputs.version }}_x64_installer.zip |
          | macOS (Universal) | BulleBrowser_${{ github.event.inputs.version }}_universal.dmg |
          | macOS (Apple Silicon) | BulleBrowser_${{ github.event.inputs.version }}_arm64.dmg |
          | macOS (Intel x64) | BulleBrowser_${{ github.event.inputs.version }}_x64.dmg |
          | Linux (AppImage) | BulleBrowser_${{ github.event.inputs.version }}_x64.AppImage |
          | Linux (deb) | BulleBrowser_${{ github.event.inputs.version }}_amd64.deb |

          ---
          Powered by [Bulle Consulting](https://bulleconsulting.com/bullebrowser)
          NOTES

      - name: Create or update BulleBrowser GitHub release
        run: |
          set -e
          VER="${VERSION}"
          if gh release view "${VER}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${VER} exists, uploading assets..."
          else
            gh release create "${VER}" \
              --repo "${REPO}" \
              --title "BulleBrowser ${VER}" \
              --notes-file /tmp/release_notes.md
          fi
          UPLOADED=0
          for FILE in assets/BulleBrowser_*; do
            if [ -f "${FILE}" ]; then
              gh release upload "${VER}" "${FILE}" --repo "${REPO}" --clobber
              UPLOADED=$((UPLOADED + 1))
            fi
          done
          echo "Uploaded ${UPLOADED} assets to BulleBrowser ${VER}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-push-ack:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Acknowledge workflow file update on push
        run: |
          echo "rebrand-release.yml updated. Use workflow_dispatch to trigger a release."
          echo "No release actions taken on push."
