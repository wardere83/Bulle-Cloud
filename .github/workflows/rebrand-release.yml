name: BulleBrowser - Rebrand & Release
# Patches BrowserOS DMG app bundle to BulleBrowser branding

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'BrowserOS version tag to rebrand (e.g. v0.44.0.1)'
        required: true
        default: 'v0.44.0.1'

jobs:
  rebrand-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo (for BulleBrowser.png logo)
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install create-dmg imagemagick || true

      - name: Download BrowserOS macOS DMGs
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          mkdir -p work release
          for ARCH in arm64 x64 universal; do
            FNAME="BrowserOS_${VER}_${ARCH}.dmg"
            URL="https://github.com/browseros-ai/BrowserOS/releases/download/${VER}/${FNAME}"
            echo "Downloading ${FNAME}..."
            if wget -q -O "work/${FNAME}" "${URL}"; then
              echo "  OK: ${FNAME}"
            else
              echo "  SKIP: ${FNAME} not found"
              rm -f "work/${FNAME}"
            fi
          done
          ls -lh work/

      - name: Rebrand each DMG
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          LOGO="packages/browseros/resources/BulleBrowser.png"

          for SRC_DMG in work/BrowserOS_*.dmg; do
            [ -f "${SRC_DMG}" ] || continue
            FNAME=$(basename "${SRC_DMG}")
            ARCH=$(echo "${FNAME}" | sed 's/BrowserOS_.*_\(.*\)\.dmg/\1/')
            DEST_DMG="release/BulleBrowser_${VER}_${ARCH}.dmg"

            echo "=== Rebranding ${FNAME} -> $(basename ${DEST_DMG}) ==="

            # Mount original DMG
            MOUNT_DIR="/Volumes/BrowserOS_${ARCH}"
            hdiutil attach "${SRC_DMG}" -mountpoint "${MOUNT_DIR}" -nobrowse -quiet

            # Find the .app bundle
            SRC_APP=$(find "${MOUNT_DIR}" -maxdepth 2 -name "*.app" | head -1)
            echo "  Source app: ${SRC_APP}"

            # Copy app to working directory
            WORK_APP="/tmp/BulleBrowser_${ARCH}.app"
            rm -rf "${WORK_APP}"
            cp -R "${SRC_APP}" "${WORK_APP}"

            # Unmount original DMG
            hdiutil detach "${MOUNT_DIR}" -quiet || true

            # Patch Info.plist - app name and bundle ID
            PLIST="${WORK_APP}/Contents/Info.plist"
            if [ -f "${PLIST}" ]; then
              echo "  Patching Info.plist..."
              plutil -replace CFBundleName -string "BulleBrowser" "${PLIST}"
              plutil -replace CFBundleDisplayName -string "BulleBrowser" "${PLIST}"
              plutil -replace CFBundleIdentifier -string "com.bulleconsulting.bullebrowser" "${PLIST}"
              # Remove update URL to prevent BrowserOS OTA updates
              plutil -remove SUFeedURL "${PLIST}" 2>/dev/null || true
              echo "  Info.plist patched."
            fi

            # Replace app icons if BulleBrowser logo exists
            if [ -f "${LOGO}" ]; then
              echo "  Replacing app icons..."
              ICNS_DIR="${WORK_APP}/Contents/Resources"
              # Convert PNG to ICNS using sips and iconutil
              ICONSET_DIR="/tmp/BulleBrowser.iconset"
              rm -rf "${ICONSET_DIR}" && mkdir "${ICONSET_DIR}"
              for SIZE in 16 32 64 128 256 512 1024; do
                sips -z ${SIZE} ${SIZE} "${LOGO}" --out "${ICONSET_DIR}/icon_${SIZE}x${SIZE}.png" --resampleHeightWidthMax ${SIZE} 2>/dev/null || \
                  convert "${LOGO}" -resize ${SIZE}x${SIZE} "${ICONSET_DIR}/icon_${SIZE}x${SIZE}.png" 2>/dev/null || true
              done
              # Create 2x versions
              for SIZE in 16 32 128 256 512; do
                SIZE2=$((SIZE * 2))
                cp "${ICONSET_DIR}/icon_${SIZE2}x${SIZE2}.png" "${ICONSET_DIR}/icon_${SIZE}x${SIZE}@2x.png" 2>/dev/null || true
              done
              iconutil -c icns "${ICONSET_DIR}" -o "/tmp/BulleBrowser.icns" 2>/dev/null || true
              if [ -f "/tmp/BulleBrowser.icns" ]; then
                # Replace all .icns files in Resources
                find "${ICNS_DIR}" -name "*.icns" | while read ICNS_FILE; do
                  cp "/tmp/BulleBrowser.icns" "${ICNS_FILE}"
                  echo "    Replaced: $(basename ${ICNS_FILE})"
                done
              fi
            fi

            # Rename the .app bundle itself
            WORK_APP_RENAMED="/tmp/BulleBrowser.app"
            rm -rf "${WORK_APP_RENAMED}"
            mv "${WORK_APP}" "${WORK_APP_RENAMED}"

            # Create new DMG
            echo "  Creating new DMG..."
            create-dmg \
              --volname "BulleBrowser" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "BulleBrowser.app" 175 190 \
              --hide-extension "BulleBrowser.app" \
              --app-drop-link 425 190 \
              "${DEST_DMG}" \
              "${WORK_APP_RENAMED}" || {
                # Fallback: simple DMG without fancy layout
                hdiutil create -volname "BulleBrowser" \
                  -srcfolder "${WORK_APP_RENAMED}" \
                  -ov -format UDZO \
                  "${DEST_DMG}"
              }

            echo "  Done: ${DEST_DMG} ($(du -sh ${DEST_DMG} | cut -f1))"
            rm -rf "${WORK_APP_RENAMED}" "/tmp/BulleBrowser.icns" "${ICONSET_DIR}"
          done

          echo "=== All rebranded DMGs ==="
          ls -lh release/

      - name: Rebrand Linux and Windows releases (rename only)
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${VERSION}"
          mkdir -p release
          LINUX_WIN_FILES=(
            "BrowserOS_${VER}_amd64.deb"
            "BrowserOS_${VER}_x64.AppImage"
            "BrowserOS_${VER}_x64_installer.exe"
            "BrowserOS_${VER}_x64_installer.zip"
          )
          for SRC in "${LINUX_WIN_FILES[@]}"; do
            URL="https://github.com/browseros-ai/BrowserOS/releases/download/${VER}/${SRC}"
            DEST="release/$(echo ${SRC} | sed 's/BrowserOS/BulleBrowser/')"
            echo "Downloading ${SRC}..."
            wget -q -O "${DEST}" "${URL}" && echo "  OK: $(basename ${DEST})" || { echo "  SKIP: not found"; rm -f "${DEST}"; }
          done
          ls -lh release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          REPO="wardere83/Bulle-Cloud"
          if ! gh release view "${VER}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Creating release ${VER}..."
            cat > /tmp/notes.md << 'EOF'
## BulleBrowser
The AI-Powered Agentic Browser by Bulle Consulting.

### Downloads
| Platform | File |
|----------|------|
| macOS (Universal) | BulleBrowser_*_universal.dmg |
| macOS (Apple Silicon) | BulleBrowser_*_arm64.dmg |
| macOS (Intel x64) | BulleBrowser_*_x64.dmg |
| Linux (AppImage) | BulleBrowser_*_x64.AppImage |
| Linux (deb) | BulleBrowser_*_amd64.deb |
| Windows (Installer) | BulleBrowser_*_x64_installer.exe |
| Windows (ZIP) | BulleBrowser_*_x64_installer.zip |

---
Powered by [Bulle Consulting](https://bulleconsulting.com/bullebrowser)
EOF
            gh release create "${VER}" \
              --repo "${REPO}" \
              --title "BulleBrowser ${VER}" \
              --notes-file /tmp/notes.md
          else
            echo "Release ${VER} exists, uploading assets..."
          fi
          UPLOADED=0
          for FILE in release/BulleBrowser_*; do
            [ -f "${FILE}" ] || continue
            echo "  Uploading $(basename ${FILE})..."
            gh release upload "${VER}" "${FILE}" --repo "${REPO}" --clobber
            UPLOADED=$((UPLOADED+1))
          done
          echo "Uploaded ${UPLOADED} assets."
