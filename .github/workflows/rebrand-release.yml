name: BulleBrowser - Download, Rebrand & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.40.1)'
        required: true
        default: 'v0.40.1'

jobs:
  rebrand-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download BrowserOS assets and rename to BulleBrowser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          mkdir -p assets
          echo "Downloading BrowserOS ${VER} assets..."
          # BrowserOS uses format: BrowserOS_v0.40.1_x64_installer.exe
          FILES=(
            "BrowserOS_${VER}_amd64.deb"
            "BrowserOS_${VER}_arm64.dmg"
            "BrowserOS_${VER}_universal.dmg"
            "BrowserOS_${VER}_x64.AppImage"
            "BrowserOS_${VER}_x64.dmg"
            "BrowserOS_${VER}_x64_installer.exe"
            "BrowserOS_${VER}_x64_installer.zip"
          )
          for SRC in "${FILES[@]}"; do
            DEST=$(echo "${SRC}" | sed 's/BrowserOS/BulleBrowser/')
            URL="https://github.com/browseros-ai/BrowserOS/releases/download/${VER}/${SRC}"
            echo "  Downloading ${SRC} -> ${DEST}"
            if wget -q --show-progress -O "assets/${DEST}" "${URL}"; then
              echo "  SUCCESS: ${DEST}"
            else
              echo "  WARNING: Failed to download ${SRC}, skipping"
              rm -f "assets/${DEST}"
            fi
          done
          echo "Assets ready:"
          ls -lh assets/ || echo "No assets downloaded"

      - name: Create or update BulleBrowser GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          REPO="wardere83/Bulle-Cloud"

          # Check if release exists, create if not
          if gh release view "${VER}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${VER} already exists, uploading assets..."
          else
            echo "Creating release ${VER}..."
            gh release create "${VER}" \
              --repo "${REPO}" \
              --title "BulleBrowser ${VER}" \
              --notes "## BulleBrowser ${VER}

The AI-Powered Agentic Browser by Bulle Consulting — built on Chromium with intelligent agents that understand and assist your workflow.

### Downloads

| Platform | Download |
|----------|----------|
| Windows (x64 Installer) | BulleBrowser_${VER}_x64_installer.exe |
| Windows (x64 ZIP) | BulleBrowser_${VER}_x64_installer.zip |
| macOS (Universal) | BulleBrowser_${VER}_universal.dmg |
| macOS (Apple Silicon) | BulleBrowser_${VER}_arm64.dmg |
| macOS (Intel x64) | BulleBrowser_${VER}_x64.dmg |
| Linux (AppImage) | BulleBrowser_${VER}_x64.AppImage |
| Linux (deb) | BulleBrowser_${VER}_amd64.deb |

---
Powered by [Bulle Consulting](https://bulleconsulting.com)"
          fi

          # Upload all renamed assets
          UPLOADED=0
          for FILE in assets/BulleBrowser_*; do
            if [ -f "${FILE}" ]; then
              echo "  Uploading $(basename ${FILE})..."
              gh release upload "${VER}" "${FILE}" \
                --repo "${REPO}" \
                --clobber
              UPLOADED=$((UPLOADED + 1))
            fi
          done
          echo "Uploaded ${UPLOADED} assets to BulleBrowser ${VER}"
